          const canvas = document.createElement('canvas');
          const MAX = 400;
          let w = img.width, h = img.height;
          if (w > h) { if (w > MAX) { h = h * MAX / w; w = MAX; } }
          else { if (h > MAX) { w = w * MAX / h; h = MAX; } }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const base64 = canvas.toDataURL('image/jpeg', 0.75);
          resolve({ url: base64, error: null });
        };
        img.src = e.target.result;
      };
      reader.onerror = () => resolve({ url: null, error: 'Error leyendo archivo' });
      reader.readAsDataURL(file);
    });
  }
};

    const file = e.target.files[0];
    if (!file) return;
    setPhotoFile(file);

    e.preventDefault();

          </div>
          <div className="form-group">
            <label>Status</label>
            <select value={form.status} onChange={e=>set('status',e.target.value)}>

      </div>
    </form>
  );

function StudentsPage({ students, onAdd, onEdit, onDelete, onView }) {
  const [search, setSearch] = useState('');
  const [filterGrupo, setFilterGrupo] = useState('');
  const [filterStatus, setFilterStatus] = useState('');

  const filtered = students.filter(s => {
    const q = search.toLowerCase();
    const matchQ = !q || s.nombre_completo.toLowerCase().includes(q) || s.matricula.toLowerCase().includes(q) || (s.dx||'').toLowerCase().includes(q);
    const matchG = !filterGrupo || s.grupo === filterGrupo;
    const matchS = !filterStatus || s.status === filterStatus;
    return matchQ && matchG && matchS;
  });

  const statusColor = (st) => {
    if (st === 'Activo') return 'badge-success';
    if (st === 'Baja') return 'badge-warn';
    if (st === 'Egresado') return 'badge-blue';
    return 'badge-gray';
  };

  return (
    <div>
      <div className="card">
        <div className="card-header">
          <div className="filter-row">
            <div className="search-bar">
              <span className="search-icon" style={{display:"flex",alignItems:"center"}}><Icon name="search" size={15} color="var(--gray-400)" /></span>
              <input type="text" placeholder="Buscar alumno..." value={search} onChange={e=>setSearch(e.target.value)} />
            </div>
            <select className="filter-select" value={filterGrupo} onChange={e=>setFilterGrupo(e.target.value)}>
              <option value="">Todos los grupos</option>
              {GRUPOS.map(g=><option key={g}>{g}</option>)}
            </select>
            <select className="filter-select" value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
              <option value="">Todos los status</option>
              {STATUS_OPTS.map(s=><option key={s}>{s}</option>)}
            </select>
          </div>
          <button className="btn btn-primary btn-sm" onClick={onAdd}>+ Nuevo Alumno</button>
        </div>
        <div className="table-wrap">
          {filtered.length === 0 ? (
            <div className="empty-state">
              <div style={{display:"flex",justifyContent:"center",marginBottom:12}}><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--gray-300)" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></div>
              <h3>No se encontraron alumnos</h3>
              <p>Prueba con otros filtros o agrega un nuevo alumno.</p>
            </div>
          ) : (
            <table>
              <thead>
                <tr>
                  <th>Alumno</th>
                  <th>Matrícula</th>
                  <th>Grupo</th>
                  <th>DX</th>
                  <th>Edad</th>
                  <th>Status</th>
                  <th>Teléfono</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                {filtered.map(s => (
                  <tr key={s.id}>
                    <td>
                      <div className="avatar-cell">
                        {s.foto_url
                          ? <img src={s.foto_url} className="avatar" alt="foto" />
                          : <div className="avatar-initials">{initials(s.nombre_completo)}</div>
                        }
                        <span className="student-name">{s.nombre_completo}</span>
                      </div>
                    </td>
                    <td><span className="student-id">{s.matricula}</span></td>
                    <td><span className="badge badge-blue">{s.grupo || '—'}</span></td>
                    <td style={{maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.dx || <span className="text-muted">—</span>}</td>
                    <td>{calcEdad(s.fecha_nacimiento)}</td>
                    <td><span className={`badge ${statusColor(s.status)}`}>{s.status || '—'}</span></td>
                    <td>{s.telefono_principal}</td>
                    <td>
                      <div style={{display:'flex',gap:4}}>
                        <button className="btn-icon" title="Ver perfil" onClick={()=>onView(s)}><Icon name="view" size={15} /></button>
                        <button className="btn-icon" title="Editar" onClick={()=>onEdit(s)}><Icon name="edit" size={15} /></button>
                        <button className="btn-icon danger" title="Eliminar" onClick={()=>onDelete(s)}><Icon name="trash" size={15} /></button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
        {filtered.length > 0 && (
          <div style={{padding:'10px 20px',borderTop:'1px solid var(--gray-100)',fontSize:13,color:'var(--gray-400)'}}>
            Mostrando {filtered.length} de {students.length} alumnos
          </div>
        )}
      </div>
    </div>
  );
}

              ['Edad', calcEdad(student.fecha_nacimiento)],
              ['Diagnóstico', student.dx],
              ['Grupo', student.grupo],
            ])}
          </div>
        </div>
        <div className="card">
          <div className="card-header"><span style={{fontWeight:600,color:'var(--navy)',fontSize:14}}>Datos Médicos</span></div>
          <div className="card-body">
            {fields([
              ['Factor RH', student.factor_rh],
              ['Alergias', student.alergias],
              ['Redes / Terapias', student.redes_auto],
            ])}
          </div>
        </div>
        <div className="card" style={{gridColumn:'1/-1'}}>
          <div className="card-header"><span style={{fontWeight:600,color:'var(--navy)',fontSize:14}}>Familia y Contacto</span></div>
          <div className="card-body">
            {fields([
              ['Nombre de la Madre', student.nombre_madre],
              ['Nombre del Padre', student.nombre_padre],
              ['Teléfono Principal', student.telefono_principal],
              ['Teléfono Secundario', student.telefono_secundario],
            ])}
          </div>
        </div>
      </div>
    </div>
  );
}

function IDGeneratorPage({ students }) {
  const [selected, setSelected] = useState(null);
  const [exporting, setExporting] = useState(false);
  const [search, setSearch] = useState('');

  const filtered = students.filter(s=>
    !search || s.nombre_completo.toLowerCase().includes(search.toLowerCase()) || s.matricula.toLowerCase().includes(search.toLowerCase())
  );

  const exportPDF = async () => {
    if (!selected) return;
    setExporting(true);
    try {
      const card = document.getElementById('id-card-export');
      const canvas = await html2canvas(card, { scale: 3, useCORS: true, backgroundColor: null });
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: [85.6, 54] });
      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      pdf.addImage(imgData, 'JPEG', 0, 0, 85.6, 54);
      pdf.save(`credencial-${selected.matricula}.pdf`);
    } catch (e) { alert('Error al exportar. Intenta de nuevo.'); }
    setExporting(false);
  };

  const printCard = () => {
    const card = document.getElementById('id-card-export');
    const w = window.open('', '_blank');
    w.document.write(`<html><head><style>*{margin:0;padding:0;box-sizing:border-box;} body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#fff;} @media print{body{margin:0;} .no-print{display:none;}}</style></head><body>`);
    w.document.write(card.outerHTML);
    w.document.write(`</body></html>`);
    w.document.close();
    w.focus();
    setTimeout(() => { w.print(); w.close(); }, 500);
  };

  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24,alignItems:'start'}}>
      <div className="card">
        <div className="card-header">
          <span style={{fontWeight:600,color:'var(--navy)'}}>Seleccionar Alumno</span>
        </div>
        <div style={{padding:'12px 20px',borderBottom:'1px solid var(--gray-100)'}}>
          <div className="search-bar">
            <span className="search-icon" style={{display:"flex",alignItems:"center"}}><Icon name="search" size={15} color="var(--gray-400)" /></span>
            <input type="text" placeholder="Buscar..." value={search} onChange={e=>setSearch(e.target.value)} style={{width:'100%'}} />
          </div>
        </div>
        <div style={{maxHeight:400,overflowY:'auto'}}>
          {filtered.map(s => (
            <div key={s.id} onClick={()=>setSelected(s)}
              style={{padding:'12px 20px',cursor:'pointer',borderBottom:'1px solid var(--gray-100)',background:selected?.id===s.id?'var(--sky-light)':'transparent',display:'flex',alignItems:'center',gap:12,transition:'background .15s'}}>
              {s.foto_url
                ? <img src={s.foto_url} className="avatar" alt="foto" />
                : <div className="avatar-initials">{initials(s.nombre_completo)}</div>
              }
              <div>
                <div style={{fontWeight:500,fontSize:14,color:'var(--gray-800)'}}>{s.nombre_completo}</div>
                <div style={{fontSize:12,color:'var(--gray-400)',fontFamily:'DM Mono,monospace'}}>{s.matricula}</div>
              </div>
              {selected?.id===s.id && <span style={{marginLeft:'auto',display:'flex',alignItems:'center'}}><svg width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='var(--sky)' strokeWidth='2.5' strokeLinecap='round' strokeLinejoin='round'><polyline points='20 6 9 17 4 12'/></svg></span>}
            </div>
          ))}
        </div>
      </div>

      <div>
        <div className="card" style={{marginBottom:16}}>
          <div className="card-header"><span style={{fontWeight:600,color:'var(--navy)'}}>Vista Previa de Credencial</span></div>
          <div className="card-body" style={{display:'flex',flexDirection:'column',alignItems:'center',gap:20}}>
            {selected ? (
              <>
                <IDCardView student={selected} />
                <p style={{fontSize:12,color:'var(--gray-400)',textAlign:'center'}}>Credencial formato CR80 (tarjeta estándar 85.6×54mm)</p>
                <div style={{display:'flex',gap:10,width:'100%'}}>
                  <button className="btn btn-primary" style={{flex:1}} onClick={exportPDF} disabled={exporting}>
                    {exporting ? <><span className="spinner"/>&nbsp;Exportando...</> : 'Exportar PDF'}
                  </button>
                  <button className="btn btn-ghost" onClick={printCard}>Imprimir</button>
                </div>
              </>
            ) : (
              <div className="empty-state" style={{padding:'40px 20px'}}>
                <div style={{display:"flex",justifyContent:"center",marginBottom:12}}><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--gray-300)" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg></div>
                <h3>Selecciona un alumno</h3>
                <p>La credencial se generará automáticamente.</p>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function AttendancePage({ students }) {
  const today = new Date().toISOString().split('T')[0];
  const [selectedDate, setSelectedDate] = useState(today);
  const [selectedGroup, setSelectedGroup] = useState(GRUPOS[0]);
  const [attendance, setAttendance] = useState({});
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);

  const groupStudents = students.filter(s => s.grupo === selectedGroup && s.status === 'Activo');
  const storageKey = `attendance_${selectedDate}_${selectedGroup}`;

  useEffect(() => {
    const stored = localStorage.getItem(storageKey);
    if (stored) {
      setAttendance(JSON.parse(stored));
    } else {
      const init = {};
      groupStudents.forEach(s => { init[s.id] = 'presente'; });
      setAttendance(init);
    }
    setSaved(false);
  }, [selectedDate, selectedGroup]);

  const toggle = (id, val) => setAttendance(a => ({...a, [id]: val}));

  const saveAttendance = async () => {
    setSaving(true);
    localStorage.setItem(storageKey, JSON.stringify(attendance));
    if (!DEMO_MODE && supabase) {
      const rows = Object.entries(attendance).map(([estudiante_id, status]) => ({
        estudiante_id, fecha: selectedDate, status, grupo: selectedGroup
      }));
      await supabase.from('asistencia').upsert(rows, { onConflict: 'estudiante_id,fecha' });
    }
    setSaving(false);
    setSaved(true);
    setTimeout(() => setSaved(false), 2500);
  };

  const presentes = Object.values(attendance).filter(v => v === 'presente').length;
  const ausentes = Object.values(attendance).filter(v => v === 'ausente').length;
  const justificados = Object.values(attendance).filter(v => v === 'justificado').length;

  const statusStyle = (val, current) => ({
    padding: '5px 14px', borderRadius: 6, fontSize: 13, fontWeight: 500, cursor: 'pointer', border: 'none',
    background: current === val ? (val==='presente'?'var(--success)':val==='ausente'?'var(--danger)':'var(--warn)') : 'var(--gray-100)',
    color: current === val ? '#fff' : 'var(--gray-500)',
    transition: 'all .15s'
  });

  return (
    <div>
      <div className="stats-grid" style={{marginBottom:20}}>
        {[
          {label:'Presentes', value:presentes, bg:'var(--success-bg)', color:'var(--success)'},
          {label:'Ausentes', value:ausentes, bg:'var(--danger-bg)', color:'var(--danger)'},
          {label:'Justificados', value:justificados, bg:'var(--warn-bg)', color:'var(--warn)'},
          {label:'Total grupo', value:groupStudents.length, bg:'var(--sky-light)', color:'var(--sky)'},
        ].map(s => (
          <div key={s.label} style={{background:s.bg,borderRadius:'var(--radius-lg)',padding:'16px 20px',border:'1px solid var(--gray-200)'}}>
            <div style={{fontSize:11,fontWeight:600,textTransform:'uppercase',letterSpacing:'.5px',color:s.color,marginBottom:6}}>{s.label}</div>
            <div style={{fontSize:26,fontWeight:700,color:s.color}}>{s.value}</div>
          </div>
        ))}
      </div>

      <div className="card">
        <div className="card-header">
          <div style={{display:'flex',gap:12,alignItems:'center',flexWrap:'wrap'}}>
            <input type="date" value={selectedDate} onChange={e=>setSelectedDate(e.target.value)}
              style={{padding:'8px 12px',border:'1px solid var(--gray-200)',borderRadius:'var(--radius)',fontSize:14,fontFamily:'DM Sans,sans-serif'}} />
            <select value={selectedGroup} onChange={e=>setSelectedGroup(e.target.value)} style={{padding:'8px 12px',border:'1px solid var(--gray-200)',borderRadius:'var(--radius)',fontSize:14,fontFamily:'DM Sans,sans-serif'}}>
              {GRUPOS.map(g=><option key={g}>{g}</option>)}
            </select>
          </div>
          <button className="btn btn-primary btn-sm" onClick={saveAttendance} disabled={saving}>
            {saving ? <><span className="spinner"/>&nbsp;Guardando...</> : saved ? 'Guardado' : 'Guardar asistencia'}
          </button>
        </div>
        {groupStudents.length === 0 ? (
          <div className="empty-state"><h3>Sin alumnos activos en este grupo</h3></div>
        ) : (
          <table>
            <thead>
              <tr>
                <th>Alumno</th>
                <th>Matrícula</th>
                <th>DX</th>
                <th style={{textAlign:'center'}}>Asistencia</th>
              </tr>
            </thead>
            <tbody>
              {groupStudents.map(s => (
                <tr key={s.id}>
                  <td>
                    <div className="avatar-cell">
                      {s.foto_url ? <img src={s.foto_url} className="avatar" alt="foto" /> : <div className="avatar-initials">{initials(s.nombre_completo)}</div>}
                      <span className="student-name">{s.nombre_completo}</span>
                    </div>
                  </td>
                  <td><span className="student-id">{s.matricula}</span></td>
                  <td style={{fontSize:13,color:'var(--gray-500)'}}>{s.dx || '—'}</td>
                  <td>
                    <div style={{display:'flex',gap:6,justifyContent:'center'}}>
                      {['presente','ausente','justificado'].map(v => (
                        <button key={v} style={statusStyle(v, attendance[s.id])} onClick={()=>toggle(s.id,v)}>
                          {v.charAt(0).toUpperCase()+v.slice(1)}
                        </button>
                      ))}
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

// ─── MODALS ───────────────────────────────────────────────────────────────────
function Modal({ title, onClose, children }) {
  useEffect(() => {
    const esc = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', esc);
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', esc); document.body.style.overflow = ''; };
  }, [onClose]);
  return (
    <div className="modal-overlay" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal">
        <div className="modal-header">
          <span className="modal-title">{title}</span>
          <button className="btn-icon" onClick={onClose}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function ConfirmModal({ message, onConfirm, onCancel, loading }) {
  return (
    <div className="modal-overlay">
      <div className="modal" style={{maxWidth:400}}>
        <div className="modal-body" style={{textAlign:'center',padding:'32px 24px'}}>
          <div style={{display:"flex",justifyContent:"center",marginBottom:16}}><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
          <p style={{fontSize:15,color:'var(--gray-700)'}}>{message}</p>
        </div>
        <div className="modal-footer" style={{justifyContent:'center'}}>
          <button className="btn btn-ghost" onClick={onCancel} disabled={loading}>Cancelar</button>
          <button className="btn btn-danger" onClick={onConfirm} disabled={loading}>
            {loading ? <><span className="spinner"/>&nbsp;</> : 'Eliminar'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(null);
  const [page, setPage] = useState('dashboard');
  const [students, setStudents] = useState([]);
  const [loading, setLoading] = useState(true);
  const [viewStudent, setViewStudent] = useState(null);
  const [editStudent, setEditStudent] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [formLoading, setFormLoading] = useState(false);
  const [idStudent, setIdStudent] = useState(null);
  const [alert, setAlert] = useState(null);

  const showAlert = (msg, type='success') => {
    setAlert({msg, type});
    setTimeout(() => setAlert(null), 3500);
  };

  // Auth - simple password session
  useEffect(() => {
    if (sessionStorage.getItem('eemas_auth') === '1') {
      setUser({ email: 'staff@eemas.mx', id: 'staff' });
    } else {
      setLoading(false);
    }
  }, []);

  // Load students
  useEffect(() => {
    if (!user) { setLoading(false); return; }
    loadStudents();
  }, [user]);

  const loadStudents = async () => {
    setLoading(true);
    const { data, error } = await db.getStudents();
    if (!error) setStudents(data || []);
    setLoading(false);
  };

  const handleSave = async (form, photoFile) => {
    setFormLoading(true);
    let foto_url = form.foto_url || null;

    if (photoFile) {
      const { url, error } = await db.uploadPhoto(photoFile);
      if (!error && url) foto_url = url;
    }

    const payload = { ...form, foto_url };

    if (editStudent) {
      const { error } = await db.updateStudent(editStudent.id, payload);
      if (!error) { showAlert('Alumno actualizado correctamente'); setStudents(ss => ss.map(s=>s.id===editStudent.id?{...s,...payload}:s)); setEditStudent(null); }
      else showAlert('Error al actualizar', 'error');
    } else {
      const { data, error } = await db.addStudent(payload);
      if (!error && data) { showAlert('Alumno agregado correctamente'); setStudents(ss => [...ss, data]); setShowAdd(false); }
      else showAlert('Error al agregar. Verifica que la matrícula no exista.', 'error');
    }
    setFormLoading(false);
  };

  const handleDelete = async () => {
    if (!confirmDelete) return;
    setFormLoading(true);
    const { error } = await db.deleteStudent(confirmDelete.id);
    if (!error) { showAlert('Alumno eliminado'); setStudents(ss => ss.filter(s=>s.id!==confirmDelete.id)); setConfirmDelete(null); }
    else showAlert('Error al eliminar', 'error');
    setFormLoading(false);
  };

  const handleLogout = () => {
    sessionStorage.removeItem('eemas_auth');
    setUser(null);
  };

  if (!user) return <LoginPage onLogin={setUser} />;

  const NAV = [
    { key:'dashboard', icon:'chart', label:'Dashboard' },
    { key:'students', icon:'students', label:'Alumnos' },
    { key:'id-generator', icon:'card', label:'Credenciales' },
    { key:'attendance', icon:'attendance', label:'Asistencia' },
  ];

  const pageTitles = { dashboard:'Dashboard', students:'Gestión de Alumnos', 'id-generator':'Generador de Credenciales', attendance:'Control de Asistencia' };

  const currentPage = viewStudent ? 'profile' : page;

  return (
    <div className="app-shell">
      {/* Sidebar */}
      <aside className="sidebar">
        <div className="sidebar-logo">
          <h1>{SCHOOL_NAME}</h1>
          <p>Sistema Escolar</p>
        </div>
        <nav className="sidebar-nav">
          {NAV.map(n => (
            <button key={n.key} className={`nav-item ${page===n.key && !viewStudent ? 'active' : ''}`}
              onClick={() => { setPage(n.key); setViewStudent(null); }}>
              <span className="nav-icon"><Icon name={n.icon} size={17} /></span>{n.label}
            </button>
          ))}
        </nav>
        <div className="sidebar-footer">
          <div className="user-pill">
            <div className="user-avatar">{(user.email||'U')[0].toUpperCase()}</div>
            <div className="user-info">
              <div className="user-name">{user.email}</div>
              <div className="user-role">Personal escolar</div>
            </div>
            <button className="logout-btn" onClick={handleLogout} title="Cerrar sesión"><Icon name='logout' size={15} /></button>
          </div>
        </div>
      </aside>

      {/* Main */}
      <main className="main-content">
        <div className="page-header">
          <h2 className="page-title">{viewStudent ? viewStudent.nombre_completo : pageTitles[page]}</h2>
          {page === 'students' && !viewStudent && (
            <button className="btn btn-primary" onClick={() => setShowAdd(true)}>+ Nuevo Alumno</button>
          )}
        </div>

        <div className="page-body">
          {alert && <div className={`alert alert-${alert.type}`}>{alert.msg}</div>}

          {loading ? (
            <div className="page-loader"><div className="spinner spin-dark" />Cargando datos...</div>
          ) : viewStudent ? (
            <ProfilePage student={viewStudent} onBack={()=>setViewStudent(null)} onEdit={s=>{setEditStudent(s);setPage('students');setViewStudent(null);}} onGenerateID={s=>{setIdStudent(s);setPage('id-generator');setViewStudent(null);}} />
          ) : page === 'dashboard' ? (
            <DashboardPage students={students} />
          ) : page === 'students' ? (
            <StudentsPage students={students} onAdd={()=>setShowAdd(true)} onEdit={setEditStudent} onDelete={setConfirmDelete} onView={setViewStudent} />
          ) : page === 'id-generator' ? (
            <IDGeneratorPage students={students} preselected={idStudent} />
          ) : page === 'attendance' ? (
            <AttendancePage students={students} />
          ) : null
          }
        </div>
      </main>

      {/* Add Modal */}
      {showAdd && (
        <Modal title="Agregar Nuevo Alumno" onClose={()=>setShowAdd(false)}>
          <StudentForm onSave={handleSave} onCancel={()=>setShowAdd(false)} loading={formLoading} />
        </Modal>
      )}

      {/* Edit Modal */}
      {editStudent && (
        <Modal title="Editar Alumno" onClose={()=>setEditStudent(null)}>
          <StudentForm initial={editStudent} onSave={handleSave} onCancel={()=>setEditStudent(null)} loading={formLoading} />
        </Modal>
      )}

      {/* Confirm Delete */}
      {confirmDelete && (
        <ConfirmModal message={`¿Eliminar a ${confirmDelete.nombre_completo}? Esta acción no se puede deshacer.`} onConfirm={handleDelete} onCancel={()=>setConfirmDelete(null)} loading={formLoading} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
